"Chande Kroll Stop":
  description: "Computes trailing stop levels based on ATR and price extremes, with two lines for long and short stops."
"Chande Momentum Oscillator":
  description: "Computes the Chande Momentum Oscillator (CMO) as the ratio of price change sums over a specified period."
"Chop Zone":
