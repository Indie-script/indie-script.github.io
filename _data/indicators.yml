  description: "Computes the Directional Movement Index (DMI) with +DI, -DI, and ADX lines to measure directional price movement strength."
"Donchian Channels":
  description: "Computes Donchian Channels: upper (highest high), lower (lowest low), and basis (midpoint) over a given period."
"Ease of Movement":
  description: "Combines price movement and volume to show how easily price changes per unit of volume."
"Elders Force Index":
  description: "Oscillator combining price change and volume to measure buying or selling pressure."
"Exponential Moving Average":
  description: "Plots an exponential moving average of the selected price source with configurable length and offset."
"Envelope":
  description: "Plots a moving-average basis (SMA or EMA) with upper and lower bands set at a fixed percentage from the basis."
"Fisher Transform":
  description: "Computes the Fisher Transform to identify potential price reversals by normalizing price into a Gaussian distribution."
"Hull Moving Average":
  description: "A smoothed moving average that reduces lag by combining two WMAs of different periods."
"Ichimoku Cloud":
  description: "Ichimoku Cloud indicator with conversion, base, lagging span, and leading spans A and B, forming a cloud for trend and support/resistance."
"Keltner Channels":
  description: "Plots a central moving average with upper and lower bands based on volatility (ATR, True Range, or Range) to identify overbought/oversold conditions and trend strength."
"Klinger Oscillator":
  description: "Computes Klinger Oscillator (KVO) and its signal line using signed volume and EMAs."
"Know Sure Thing":
  description: "Weighted sum of four smoothed rate-of-change (ROC) series forming the KST oscillator plus its SMA signal line."
"Linear Regression Channel":
  description: "Computes a linear regression channel with upper/lower deviation bands and Pearson's R coefficient."
"Least Squares Moving Average":
  description: "Computes a least-squares linear regression line as a moving average, often used as a smoother with reduced lag."
"MA Cross":
  description: "Plots two SMAs and a marker when they cross to signal trend changes."
"Moving Average Ribbon":
  description: "Plots up to four configurable moving averages (SMA, EMA, WMA, VWMA, SMMA) as separate lines on the chart."
"Moving Average Convergence Divergence":
  description: "Computes the Moving Average Convergence Divergence (MACD) with histogram, signal line, and customizable MA types."
"Mass Index":
  description: "Computes the sum of the ratio of two EMAs of the high-low range over a given period, used to identify trend reversals."
"McGinley Dynamic":
  description: "Adaptive moving average that smooths price while responding faster to trends."
"Median":
  description: "Computes a rolling median of the chosen source, an EMA of that median, and ATR-based upper/lower bands around the median."
"Momentum":
  description: "Computes the price change over a specified lookback period, displayed as a blue line."
"Money Flow Index":
  description: "Computes the Money Flow Index (MFI) using typical price and volume to measure overbought/oversold conditions."
"Net Volume":
  description: "Computes net volume from close prices using the built-in NetVolume algorithm."
"On Balance Volume":
  description: "Cumulative volume indicator that adds or subtracts volume based on price direction."
"Parabolic Stop And Reverse":
  description: "Computes the Parabolic Stop and Reverse (SAR) with configurable acceleration factors."
"Pivot Points High-Low":
  description: "Draws pivot high and low labels using configurable left/right lengths, with optional real-time unconfirmed candidates."
"Pivot Points Standard":
  description: "Computes standard pivot point (P), support (S1-S3) and resistance (R1-R3) levels based on prior period's high, low, close."
"Price Oscillator":
  description: "Computes the Price Oscillator (PPO) as the percentage difference between two moving averages."
"Price Volume Trend":
  description: "Cumulative sum of volume-weighted price change, measuring money flow."
"Rate Of Change":
  description: "Calculates the Rate of Change (momentum) of a selected price source over a given period."
"Relative Vigor Index":
  description: "Relative Vigor Index (RVGI) measures trend strength via smoothed close-open vs high-low ranges."
"Relative Volatility Index":
  description: "Computes the Relative Volatility Index (RVI) oscillator and a moving average of it, with optional Bollinger Bands."
"Relative Strength Index":
  description: "Computes the Relative Strength Index (RSI) with an optional moving average and Bollinger Bands overlay."
"Simple Moving Average":
  description: "Computes the Simple Moving Average (SMA) of a chosen source over a specified length, with an optional offset."
"SMI Ergodic Indicator":
  description: "Computes the True Strength Index (TSI) with an EMA signal line, plotted as the SMI Ergodic Indicator."
"SMI Ergodic Oscillator":
  description: "Computes the SMI Ergodic Oscillator as the difference between the True Strength Index and its EMA signal line."
"Smoothed Moving Average":
  description: "Smoothed Moving Average (SMMA) that applies a recursive smoothing to price data."
"Stochastic Oscillator":
  description: "Computes smoothed stochastic oscillator lines %K and %D from price data using Stoch and Sma algorithms."
"Stochastic RSI":
  description: "Computes Stochastic RSI: RSI of the source, converted to a stochastic oscillator, with smoothed K and D lines."
"Supertrend":
  description: "Computes Supertrend lines based on ATR and moving average, with directional fills."
"Triple EMA":
  description: "Computes Triple Exponential Moving Average (TEMA) for the specified source and length."
"Trading Sessions":
  description: "Shades chart bars that fall in the pre-market and after-hours trading sessions; transparent on daily or higher timeframes."
"TRIX":
  description: "Computes the TRIX oscillator as 10000 times the rate of change of a triple exponential moving average of log(close)."
"True Strength Indicator":
  description: "Computes the True Strength Index (TSI) momentum oscillator with signal line, scaled by 100."
"Ultimate Oscillator":
  description: "Plots the Ultimate Oscillator (UO) as a red line using fast, middle, and slow period lengths (defaults 7, 14, 28)."
"Volatility Stop":
  description: "A trailing stop that adjusts based on ATR volatility and flips when price crosses the stop level."
"Volume Oscillator":
  description: "Computes the percentage difference between short and long exponential moving averages of volume."
"Vortex Indicator":
  description: "Computes two lines (VI+ and VI-) measuring positive and negative trend movements."
"Volume Weighted Average Price":
  description: "Computes Volume Weighted Average Price with standard deviation bands anchored to a period."
"Volume Moving Average Weighted":
  description: "Computes the volume-weighted moving average (VWMA) of a chosen source, typically close, and plots it as a blue line."
"Williams Alligator":
