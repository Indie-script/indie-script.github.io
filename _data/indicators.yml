"Bollinger Bands Width":
  description: "Computes Bollinger Bands Width as (upper - lower) / middle from a configurable source and plots it as a teal line."
"Bull Bear Power":
  description: "Computes the sum of bull and bear power relative to an EMA, showing buying vs selling pressure."
"Chaikin Money Flow":
  description: "Computes Chaikin Money Flow (CMF) as the ratio of sum of Money Flow Volume to total volume over a given period."
