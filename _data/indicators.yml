"Average Directional Index":
  description: "Computes the Average Directional Index (ADX) to measure trend strength using ADX smoothing and DI lengths."
"Average True Range":
  description: "Computes the Average True Range, a volatility measure based on the true range (the greatest of three price differences) averaged over a given period."
