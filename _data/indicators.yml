"Williams Percent Range":
  description: "Williams %R oscillator showing where the selected source is within the highest high/lowest low range over `length` bars."
"Moving Average Weighted":
  description: "Computes a Weighted Moving Average (WMA) of the selected source with configurable length and offset."
"Woodies CCI":
  description: "Plots CCI Turbo and CCI 14 lines; histogram colored based on five consecutive bars' positivity/negativity or current bar direction."
"Zig Zag":
