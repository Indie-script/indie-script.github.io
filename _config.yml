title: Indie
url: https://indie-script.github.io
theme: minima
markdown: kramdown

defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: default
  # service files stay out of sitemap.xml
  - scope:
      path: "1.html"
    values:
      sitemap: false
  - scope:
      path: "google0ed2b5de625fc5db.html"
    values:
      sitemap: false

# README.md with front matter (category: ...) still becomes the folder index
readme_index:
  with_frontmatter: true

# repository docs that are not site pages
exclude:
  - CONTRIBUTING.md

plugins:
  - jekyll-seo-tag
  - jekyll-include-cache
